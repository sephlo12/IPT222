<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #99b898, #feceA8, #ff847c, #ac081d);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: absolute;
            top: 0;
            width: 100%;
            padding: 10px 10px;
            margin-left: -20px;
            z-index: 1;
        }

        .logo {
            height: 20px;
            width: 120px;
        }

        .navbar ul {
            list-style: none;
            display: flex;
            gap: 5px;
            padding: 0;
            margin: 0;
        }

        .navbar li a {
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            color: #384a5f;
            padding: 5px 10px;
            transition: color 0.3s ease;
        }

        .navbar li a:hover {
            color: #e84a5f;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100%;
        }

        h1 {
            font-size: 83px;
            font-weight: 900;
            text-align: center;
            font-family: 'Cooper Black', Arial, sans-serif; 
            color: transparent;
            background: linear-gradient(to bottom, #384a5f, #7e977e86, #384a5f);
            -webkit-background-clip: text;
            background-clip: text;
            margin-bottom: 20px;
            animation: bounce 3s ease-in-out infinite;
        }

        @keyframes bounce {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
            100% {
                transform: translateY(0);
            }
        }

        button:hover {
            background-color: #000000;
        }

        footer {
            text-align: center;
            padding: 10px;
            color: #feceA8;
            font-family: Arial, sans-serif;
            font-size: 0.9rem;
            position: absolute;
            bottom: 0;
            width: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>

    <nav class="navbar">
        <a href="index.html">
            <img src="milogo.png" alt="Logo" class="logo">
        </a>
        <ul>
            <li><a href="home.html">HOME</a></li>
            <li><a href="projects.html">PROJECTS</a></li>
            <li><a href="skills.html">SKILLS</a></li>
            <li><a href="education.html">EDUCATION</a></li>
            <li><a href="contacts.html">CONTACTS</a></li>
            <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
        </ul>
    </nav>

    <div class="container">
        <h1>WELCOME TO MY PORTFOLIO!</h1>
    </div>

    <footer>
        © 2025 Karl Micheal Z. Pontipedra. All rights reserved.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
    <script>
        document.getElementById('exploreButton').addEventListener('click', function() {
            alert('Navigating to your portfolio...');
        });

        particlesJS('particles-js', {
            "particles": {
                "number": {
                    "value": 55
                },
                "color": {
                    "value": "#ffffff"
                },
                "shape": {
                    "type": "circle"
                },
                "opacity": {
                    "value": 0.3
                },
                "size": {
                    "value": 3
                },
                "move": {
                    "enable": true,
                    "speed": 2
                }
            }
        });
    </script>
</body>
</html>
